<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- css style link -->
    <link rel="stylesheet" href="css/style.css">
     <!-- link icon -->
    <link rel="icon" type="image/x-icon" href="assets/images/favicon-32x32.png">
    <title>Weather app</title>
</head>
<body>
    <main>
        <div class="container">
            <img src="assets/images/logo.svg" alt="Weather Icon" class="weather-icon">
            <div class="search-container">
                <h1 class="app-title">How's the sky looking today?</h1>
                <form class="search-box" onsubmit="return false;">
                    <input type="text" id="city-input" placeholder="Search for a city...">
                    <input type="button" id="search-btn" class="button" value="Search">
                </form>
            </div>
            <div class="no-result" id="no-result">
                <h2 class="no-result-text">No search results found!</h2>
            </div>
            <div id="wrong-result" class="wrong-result hidden">
                <h2 class="wrong-result-text">Something went wrong!</h2>
            </div>
            <div id="weather-result" class="weather-result hidden">
                <!-- Weather information will be displayed here -->
                <div class="screen">
                    <div class="gradue-wheather">
                        <div class="city-info">
                            <h2  id="city-name"></h2>
                            <p id="temperature"></p> 
                        </div>
                        <h2 class="weather-description"></h2>
                    </div>
                        <div class="weather-info">
                            <ul class="weather-details">
                                <li> Feels Like <span id="description" ></span></li>
                                <li>Humidity : <span id="humidity"> </span></li>
                                <li >Wind Speed: <span id="wind-speed" ></span> </li>
                                <li >Pressure: <span id="pressure"></span> </li>
                            </ul>
                        </div>
                    <div class="daily-forecast">
                        <h2>Daily Forecast</h2>
                        <div class="forecast-container">
                            <!-- Daily forecast items will be added here -->

                        </div>
                    </div>
                </div>
                <div class="hours">
                    <h3>Hourly Forecast</h3>
                    <div class="hourly-forecast">
                        <!-- Hourly forecast items will be added here -->
                    </div>
                    <ul class="hours-daily" id="hours-daily">
                        <!-- Hourly forecast details will be added here -->
                    
                    </ul>
                </div>
            </div>
        </div>
        </div>
      
      

    </main>



    <!-- js script link -->
    <script src="js/main.js"></script>
</body>
</html>
